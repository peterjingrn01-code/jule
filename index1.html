<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>JULE — JSL Universal Language Execution Engine</title>
<script>
/* ============================================================
 * 共用顶部品牌条组件（jsl-company-bar）
 * 要在其他页面保持完全一致，请把这一整段 script 标签
 * 原样复制粘贴到那个页面的 head 里即可，不依赖任何外部网络请求。
 * ============================================================ */
(function () {
  'use strict';
  var STYLE_ID = 'jsl-company-bar-style';
  var CSS =
    '.jsl-company-bar{' +
      'position:fixed;top:0;left:0;right:0;' +
      'height:46px;z-index:2147483647;' +
      'display:flex;align-items:center;justify-content:center;' +
      'background:#fff;border-bottom:1px solid #111;' +
      'box-shadow:0 1px 5px rgba(0,0,0,.08);' +
      'padding-left:env(safe-area-inset-left);' +
      'padding-right:env(safe-area-inset-right);' +
      'box-sizing:border-box;' +
    '}' +
    '.jsl-company-bar a{' +
      'font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;' +
      'color:#17191c;text-decoration:none;' +
      'font-size:15px;font-weight:850;' +
      'display:flex;gap:8px;align-items:center;' +
      'max-width:100%;' +
    '}' +
    '.jsl-company-bar a span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}' +
    '@media(max-width:760px){.jsl-company-bar{height:44px}.jsl-company-bar a{font-size:13px}}' +
    '@media(max-width:340px){.jsl-company-bar a{font-size:12px}}';
  var HTML =
    '<a href="https://www.jsl-ian.com" target="_blank" rel="noopener">' +
      '<span aria-hidden="true">\uD83C\uDF10</span><span>www.jsl-ian.com</span>' +
    '</a>';
  function ensureStyle(){
    if (document.getElementById(STYLE_ID)) return;
    var s=document.createElement('style'); s.id=STYLE_ID; s.textContent=CSS;
    document.head.appendChild(s);
  }
  function JslCompanyBar(){ return Reflect.construct(HTMLElement, [], JslCompanyBar); }
  JslCompanyBar.prototype = Object.create(HTMLElement.prototype);
  JslCompanyBar.prototype.constructor = JslCompanyBar;
  JslCompanyBar.prototype.connectedCallback = function(){
    ensureStyle();
    this.classList.add('jsl-company-bar');
    if (!this.innerHTML.trim()) this.innerHTML = HTML;
    this._sync = this._sync.bind(this);
    this._sync();
    window.addEventListener('resize', this._sync);
    window.addEventListener('orientationchange', this._sync);
  };
  JslCompanyBar.prototype._sync = function(){
    var h=this.offsetHeight; if(h>0) document.body.style.paddingTop=h+'px';
  };
  if (!customElements.get('jsl-company-bar')) customElements.define('jsl-company-bar', JslCompanyBar);
})();
</script>
<style>
:root{--text:#17191c;--muted:#667085;--line:#cfd5dc;--blue:#1267e8;--danger:#b3261e;--app-height:100dvh}
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#fff;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-top:46px;overflow-x:hidden;min-height:var(--app-height)}
a{color:inherit;text-decoration:none} button,input{font:inherit}

/* 顶部品牌条样式已由全站共用组件 jsl-company-bar.js 统一提供，本页不再重复定义 */

main{
  width:min(1180px,100%);
  min-height:calc(var(--app-height) - 46px);
  margin:auto;padding:8px 16px 6px;
  display:grid;
  grid-template-rows:auto auto 1fr auto auto;
  gap:6px;
}

.hero{
  display:flex;align-items:center;justify-content:center;gap:18px;
  min-height:88px;padding:3px 0 5px;border-bottom:1px solid var(--line)
}
.logo{width:102px;max-height:78px;object-fit:contain}
.hero h1{margin:0;font-size:clamp(46px,7vw,72px);line-height:.9;letter-spacing:-3px;font-weight:900}
.hero sup{font-size:.3em;vertical-align:top}

.repo{text-align:center;padding:1px 0 5px;border-bottom:1px solid var(--line)}
.repo-title{margin:0 0 5px;font-size:15px;font-weight:850}
.omega-grid{display:flex;justify-content:center;align-items:center;gap:6px;flex-wrap:wrap}
.omega{min-width:54px;height:31px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-weight:800;cursor:pointer}
.omega.add{color:var(--blue);font-size:19px;border-style:dashed}

.normalizer{
  min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:7px 0 8px;border-bottom:1px solid var(--line)
}
.normalizer h2{margin:0;font-size:clamp(27px,4vw,40px);letter-spacing:-1px}
.normalizer .sub{margin:4px 0 10px;color:var(--muted);font-size:13px}
.open-form{width:min(760px,100%);display:flex;gap:8px}
.open-bar{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:9px;padding:0 15px;outline:none}
.open-bar:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(18,103,232,.12)}
.open-button,.action{height:40px;border-radius:8px;padding:0 18px;border:1px solid var(--line);background:#fff;font-weight:800;cursor:pointer}
.open-button{min-width:105px;background:var(--blue);border-color:var(--blue);color:#fff}
.actions{margin-top:8px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.message{min-height:16px;margin-top:4px;color:var(--danger);font-size:12px}

.products{padding:1px 0 5px;border-bottom:1px solid var(--line)}
.products h2{margin:0 0 5px;text-align:center;font-size:16px}
.product-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;width:100%}
.product{min-width:0;min-height:64px;padding:5px 3px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;text-align:center}
.product .omega-tag{display:block;font-size:11px;font-weight:900;margin-bottom:2px}
.product .icon{display:block;color:var(--blue);font-size:19px;line-height:1;margin-bottom:3px}
.product strong{display:block;font-size:10.5px;line-height:1.08}

footer{text-align:center;color:var(--muted);font-size:10px;line-height:1.3;padding-top:1px}

dialog{width:min(92vw,500px);border:0;border-radius:18px;padding:0;box-shadow:0 22px 60px rgba(0,0,0,.2)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.about{padding:22px} .about h2{margin:0 0 8px} .about p{color:#4b5563;line-height:1.5}
.close{border:0;border-radius:8px;padding:10px 18px;color:#fff;background:var(--text);font-weight:800}

@media(max-width:760px){
  body{padding-top:44px}
  main{width:100%;min-height:calc(var(--app-height) - 44px);padding:5px 7px 4px;gap:3px;grid-template-rows:auto auto minmax(0,1fr) auto auto}
  .hero{min-height:64px;gap:8px;padding:2px 0 3px}
  .logo{width:66px;max-height:53px}
  .hero h1{font-size:36px;letter-spacing:-1.8px}
  .repo{padding:0 0 3px}
  .repo-title{font-size:12px;margin-bottom:3px}
  .omega-grid{flex-wrap:nowrap;overflow-x:auto;justify-content:flex-start;padding:0 1px 2px;scrollbar-width:none}
  .omega-grid::-webkit-scrollbar{display:none}
  .omega{min-width:43px;height:26px;padding:0 6px;font-size:10px;border-radius:7px}
  .normalizer{min-height:0;padding:3px 0 4px;justify-content:center}
  .normalizer h2{font-size:22px}
  .normalizer .sub{font-size:10.5px;margin:2px 0 5px}
  .open-form{gap:4px}
  .open-bar{height:36px;padding:0 10px;font-size:12px;border-radius:8px}
  .open-button{height:36px;min-width:64px;padding:0 9px;font-size:12px}
  .actions{margin-top:4px;gap:4px}
  .action{height:30px;padding:0 9px;font-size:10.5px}
  .message{min-height:12px;margin-top:2px;font-size:9.5px}
  .products{padding:0 0 3px}
  .products h2{font-size:12px;margin-bottom:3px}
  .product-grid{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;overflow:visible;padding:0}
  .product{min-width:0;min-height:48px;padding:3px 1px;border-radius:6px}
  .product .omega-tag{font-size:8px;margin-bottom:1px}
  .product .icon{font-size:13px;margin-bottom:1px}
  .product strong{font-size:7px;line-height:1.05}
  footer{font-size:7.5px;padding-top:0}
}
@media(max-width:420px){
  main{padding-left:5px;padding-right:5px}
  .hero{min-height:58px}
  .logo{width:58px;max-height:47px}
  .hero h1{font-size:31px}
  .normalizer h2{font-size:20px}
  .open-bar{font-size:11px}
  .product strong{font-size:6.5px}
}
@media(max-width:360px){
  .hero h1{font-size:28px}
  .logo{width:53px}
  .omega{min-width:39px}
  .action{padding:0 7px}
  .product .icon{font-size:12px}
  .product strong{font-size:6px}
}
@media(max-height:700px) and (min-width:761px){
  .hero{min-height:76px} .logo{width:86px} .hero h1{font-size:58px}
  .normalizer h2{font-size:32px} .product{min-height:58px}
}
</style>
</head>
